# Auth users for the workbench login gate.
#
# Prefer managing this file with the CLI, which validates the entry, hashes the
# password, and revokes the user's stale cookies:
#
#   harness-ctl user add alice          # or, without the ops wrapper:
#   orchestrator user add alice --password-stdin
#
# To manage it by hand, copy this file to config/auth-users.yaml (which is
# gitignored) and replace the hashes. Generate a hash with:
#
#   echo -n 'your-password' | go run ./orchestrator/cmd/authhash
#
# Either way the running orchestrator reloads this file when it changes, so
# adding a user or rotating a password does NOT need a restart. A file that is
# unreadable or fails to parse is ignored (the previous credentials keep
# serving) rather than emptying the credential set.
#
# Notes:
#  - usernames may contain only letters, digits, "_" and "-" (1-64 chars).
#  - passwords are stored ONLY as PBKDF2-SHA256 hashes, never in plaintext.
#  - the "lab" user inherits the existing sessions created before login was
#    added; keep it if you want to see that history.
#  - point the orchestrator at a different file with HARNESS_AUTH_USERS_PATH.
#  - if this file is absent the orchestrator runs open (single "lab" user, no
#    login required) — only safe for local development.

users:
  - username: lab
    password_hash: "pbkdf2-sha256$600000$REPLACE_WITH_REAL_SALT$REPLACE_WITH_REAL_HASH"
  - username: alice
    password_hash: "pbkdf2-sha256$600000$REPLACE_WITH_REAL_SALT$REPLACE_WITH_REAL_HASH"
    # Optional role; omit for a regular user. Admin APIs require role: admin.
    role: admin
