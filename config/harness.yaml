harness:
  default_agent: pi
  agents:
    sh:
      enabled: true
      driver_id: sh
      runtime_provider: local_runsc
    pi:
      enabled: true
      driver_id: pi
      model_profile: anthropic_default
      runtime_provider: local_runsc
      disable_nonessential_traffic: true
  model_profiles:
    anthropic_default:
      enabled: true
      provider: anthropic_messages
      model: sonnet
      proxy_ref: model_proxy
  runtime_providers:
    local_runsc:
      enabled: true
      provider_id: local_runsc
      profile_id: local_runsc_default

  run_dir: /var/lib/harness-publish/run
  session_retention: 0s
  max_sessions: 30
  model_proxy:
    bind_url: http://0.0.0.0:8083
    sandbox_base_url: http://harness-model-proxy.internal:8083
  sandbox_identity:
    uid: 65534
    gid: 65534
    supplemental_gids: []

  network:
    cidr_pool: 10.201.0.0/16
    egress:
      doris_fe_hosts:
        - 172.16.0.138
      doris_be_hosts:
        - 172.16.0.138
      doris_ports:
        - 9030
      dns_policy: hostnames_only
      # Open sandbox egress to the entire public internet (all hosts/ports).
      # Removes the default-deny exfiltration boundary so agents can pip
      # install, hit GitHub/pypi, search, etc. See orchestrator EgressConfig.
      allow_all: true

  events:
    retention_window: 24h
    retention_rows: 1000000
    emit_output_batch_max_rows: 64
    emit_output_batch_max_age: 100ms

  probe:
    accept_status:
      get_healthz:
        - 200
      post_v1_messages:
        unauthorized:
          - 401
        malformed_authenticated:
          - 400
    pre_start_attempts: 3
    pre_start_interval: 500ms
    post_start_attempts: 5
    post_start_interval: 1s

  bridge:
    lease_ttl: 60s
    heartbeat_interval: 30s
    poll_interval: 5ms
    ack_started_grace: 90s
    reconnect_grace: 30s
    # How long an active/idle generation may go without a sandbox heartbeat
    # before the orchestrator stops self-renewing its lease, letting the lease
    # lapse so recovery fails/requeues the stuck turn (prevents zombie sessions
    # stuck on "thinking" after a sandbox dies). Must be >= lease_ttl.
    sandbox_heartbeat_stall_grace: 90s

  checkpoint:
    # auto_enabled now gates automatic idle *release*: when a session is idle
    # past idle_threshold, the monitor tears down its sandbox to free the
    # compute/slot (no runsc checkpoint image is taken). The next message
    # cold-starts a fresh generation from the persisted agent-home + workspace.
    # See docs/sandbox-runtime.md (Idle release and checkpoint/restore).
    auto_enabled: true
    idle_threshold: 2h
    monitor_interval: 5m

  reaper:
    failed_retention: 10m
    checkpoint_image_retention: 720h
