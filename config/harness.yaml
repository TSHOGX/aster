harness:
  default_agent: pi
  agents:
    # Shell mode is not served in production: one sh session was ever created
    # (destroyed 2026-06-24) against 236 pi sessions. Disabling it here makes
    # resolveModeDeployment("shell") fail, which the session-modes endpoint
    # turns into Visible:false, so the UI stops offering it. The driver spec
    # stays in the code; this is the only switch needed to take it out of
    # service. Matches SANDBOX_AGENT_DRIVERS=pi in sandbox-image/build.env.
    sh:
      enabled: false
      driver_id: sh
      runtime_provider: local_runsc
    pi:
      enabled: true
      driver_id: pi
      model_profile: anthropic_default
      runtime_provider: local_runsc
      disable_nonessential_traffic: true
  model_profiles:
    anthropic_default:
      enabled: true
      provider: anthropic_messages
      model: sonnet
      proxy_ref: model_proxy
  runtime_providers:
    local_runsc:
      enabled: true
      provider_id: local_runsc
      profile_id: local_runsc_default

  run_dir: /var/lib/harness-publish/run
  session_retention: 0s
  max_sessions: 30
  model_proxy:
    bind_url: http://0.0.0.0:8083
    sandbox_base_url: http://harness-model-proxy.internal:8083
  # Host-side data-store gateways. One shared gateway process serves every
  # sandbox: it terminates auth with the fake sandbox credential below and
  # relays to Doris with the real one, which never enters a sandbox.
  #
  # bind_addr is a wildcard on purpose. Each generation gets its own /30 veth
  # pair and therefore its own host-gateway address (10.201.0.1, 10.201.0.5,
  # ...), which is what the sandbox_alias resolves to, so there is no single
  # stable address to bind. model_proxy.bind_url above is a wildcard for the
  # same reason. The wildcard also answers on this host's LAN address while
  # holding the real credential, so the packet filter installed by
  # data-proxies/doris/deploy/gateway-up.sh is a hard prerequisite — start the
  # gateway with that script, not by hand.
  data_proxies:
    doris:
      enabled: true
      bind_addr: 0.0.0.0:9030
      sandbox_alias: harness-doris-gateway.internal
      sandbox_port: 9030
      sandbox_user: sandbox
      upstream:
        kind: doris_mysql
        addr: 172.16.0.138:9030
        databases:
          - vhr_data
          - vehicle_signal
          - watt

    # OBS object store behind a host-side HTTP gateway. The real AK/SK live only
    # in the gateway's EnvironmentFile (/etc/harness/obs-gateway.env); each
    # sandbox gets a per-generation fake pair via /harness-control/obs.json.
    # Start the gateway with data-proxies/obs/obs-gateway.sh, which also applies
    # the iptables rules the 0.0.0.0 bind requires.
    #
    # Requires OBS_GATEWAY_MASTER_KEY in the orchestrator's own environment,
    # matching the gateway's: the orchestrator ISSUES the per-generation fake
    # credentials that the gateway VERIFIES. Delivered by the systemd drop-in at
    # /etc/systemd/system/harness-publish-orchestrator.service.d/10-obs-gateway.conf.
    # If it is ever missing, generation start still succeeds — the projection is
    # skipped with a loud log and only OBS reads fail. See data-proxies/obs/.
    obs:
      enabled: true
      bind_addr: 0.0.0.0:8084
      sandbox_alias: harness-obs.internal
      sandbox_port: 8084
      # Vestigial for OBS: the sandbox authenticates with a fake AK/SK, not a
      # username. Present because this schema is shared with the MySQL-shaped
      # Doris gateway. Authorization is by source IP against the live turn.
      sandbox_user: sandbox
      upstream:
        kind: obs_http
        base_url: https://obs.cn-north-4.myhuaweicloud.com

  sandbox_identity:
    uid: 65534
    gid: 65534
    supplemental_gids: []

  network:
    cidr_pool: 10.201.0.0/16
    egress:
      doris_fe_hosts:
        - 172.16.0.138
      doris_be_hosts:
        - 172.16.0.138
      doris_ports:
        - 9030
      dns_policy: hostnames_only
      # Open sandbox egress to the entire public internet (all hosts/ports).
      # Removes the default-deny exfiltration boundary so agents can pip
      # install, hit GitHub/pypi, search, etc. See orchestrator EgressConfig.
      allow_all: true

  events:
    retention_window: 24h
    retention_rows: 1000000
    emit_output_batch_max_rows: 64
    emit_output_batch_max_age: 100ms

  probe:
    accept_status:
      get_healthz:
        - 200
      post_v1_messages:
        unauthorized:
          - 401
        malformed_authenticated:
          - 400
    pre_start_attempts: 3
    pre_start_interval: 500ms
    post_start_attempts: 5
    post_start_interval: 1s

  bridge:
    lease_ttl: 60s
    heartbeat_interval: 30s
    # Bridge polling is database-backed; 50ms keeps interactive pickup fast
    # without running a full multi-join query hundreds of times per second.
    poll_interval: 50ms
    ack_started_grace: 90s
    reconnect_grace: 30s
    # How long an active/idle generation may go without a sandbox heartbeat
    # before the orchestrator stops self-renewing its lease, letting the lease
    # lapse so recovery fails/requeues the stuck turn (prevents zombie sessions
    # stuck on "thinking" after a sandbox dies). Must be >= lease_ttl.
    sandbox_heartbeat_stall_grace: 90s
    # How long past its lease expiry a running turn may still have model requests
    # authorized. Turn leases are renewed only by the bridge heartbeat, which
    # competes for the single writer connection; a heartbeat delayed by write
    # pressure used to reject every model call the turn made until the next one
    # landed, which surfaced to users as "the model service is unavailable".
    # Identity is unaffected - the generation must still be live and the lease
    # owner must still match. Must be < sandbox_heartbeat_stall_grace, or a
    # sandbox already judged stalled would keep model access.
    proxy_lease_grace: 60s

  # Cron Agent runs independently from maintenance. Persisted schedules are
  # picked up automatically when this scheduler is enabled.
  scheduler:
    enabled: true
    poll_interval: 5s
    worker_count: 2
    lease_ttl: 2m
    default_timeout: 30m
    max_retries: 2
    retry_backoff: 30s
    max_concurrent_runs: 4
    # How late a missed cron window may still run. Past this the scheduler skips
    # to the next future trigger rather than replaying the backlog window by
    # window (which for a per-minute schedule never catches up: each replay is a
    # cold sandbox and a real model call, slower than new windows appear).
    # Raise it for schedules that should still fire when merely late.
    misfire_grace: 90s
    # Ceiling on queued+running runs per schedule, so retries and manual runs
    # cannot accumulate without bound.
    max_pending_runs_per_schedule: 3

#   runtime:
    # Per-command ceiling for everything the orchestrator shells out to
    # (runsc kill/delete/state, ip, nft). A half-dead sandbox — OOM-killed
    # workload, control socket open but unresponsive — makes `runsc kill` hang
    # indefinitely; unbounded, that call stalled the whole maintenance loop for
    # 34h and no session could start a sandbox. See
    # docs/proposals/runsc-cleanup-hang-blocks-maintenance.md.
#     command_timeout: 30s
    # Per-sandbox memcg ceiling. Was hardcoded at 1 GiB, which OOM-killed a
    # data-analysis session on ~873 MB of pandas shared memory. A ceiling, not a
    # reservation: max_sessions x limit may exceed host RAM because sandboxes are
    # overwhelmingly idle. Lower it if a host runs many concurrent heavy jobs.
#     sandbox_memory_limit_bytes: 4294967296  # 4 GiB
#     sandbox_pids_limit: 256
#
#   maintenance:
    # Ceiling for a single maintenance stage. On expiry the loop moves on and the
    # overrunning stage is skipped on later ticks until it finishes, so it can
    # never overlap itself. Must be >= runtime.command_timeout, so a stage doing
    # one teardown fails on its own command timeout with a clear error instead of
    # being cut off mid-flight.
#     stage_timeout: 2m
    # Cold fallback starts a sandbox for sessions whose generation died with turns
    # still queued. It runs on its own ticker and worker, independent of the
    # cleanup stages: this is the availability-critical path, and a stalled reaper
    # must never keep new turns from starting.
#     cold_fallback_interval: 5s
#
  checkpoint:
    # auto_enabled now gates automatic idle *release*: when a session is idle
    # past idle_threshold, the monitor tears down its sandbox to free the
    # compute/slot (no runsc checkpoint image is taken). The next message
    # cold-starts a fresh generation from the persisted agent-home + workspace.
    # See docs/sandbox-runtime.md (Idle release and checkpoint/restore).
    auto_enabled: true
    idle_threshold: 2h
    monitor_interval: 5m

  reaper:
    failed_retention: 10m
    checkpoint_image_retention: 720h
