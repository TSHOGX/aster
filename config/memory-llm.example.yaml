# Optional: LLM for the nightly trajectory-distillation pipeline (agents-kb).
# Copy to config/memory-llm.yaml (gitignored) and fill in api_key.
# When api_key is empty or this file is absent, the nightly pipeline is disabled
# and the shared /agents knowledge base is only ever updated by hand.
enabled: true
base_url: https://model-api.example.com/v1
api_key: ""
model: example-model

# Optional: agentic context-evolution graph. When agentic:true the
# consolidate/verify/curate/critic nodes run as local `pi` agents (see
# docs/agents-kb.md) instead of scalar heuristics.
# agent_provider/agent_model must exist in pi's own models.json (the api key
# lives there, never here). Can also be toggled with HARNESS_MEMORY_AGENTIC=true.
agentic: false
agent_bin: pi
agent_provider: example-provider
agent_model: example-model

# Expert-approval gate for KB publication. false (default) = a finished cycle
# only stages a snapshot under agents-kb/ plus a `pending` marker, and a human
# must approve it (`orchestrator kb approve <digest>`) before sandboxes mount it.
# true = the cycle re-points `current` itself. Env: HARNESS_MEMORY_AUTO_PUBLISH.
auto_publish: false
