name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    # The orchestrator runs as root in production (see docs/operations.md) and
    # its store/artifacts tests assert root ownership / chown directories
    # accordingly, so the job runs as root (container default user) rather
    # than the runner's non-root default user.
    container: golang:1.27.1
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # A lockfile committed from a host with an npm mirror configured pins every
      # `resolved` URL to that mirror, and is then only installable from that one
      # network. Catch it here rather than as an ECONNRESET on someone's machine.
      - run: ../scripts/check-lockfile-registry.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 ../scripts/release/smoke-standalone.py

  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest sandbox-image/tests/test_harness_bridge_client.py
      - run: python3 -m py_compile scripts/release/*.py
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: bash -n scripts/release/build-rootfs.sh sandbox-image/build-rootfs.sh
