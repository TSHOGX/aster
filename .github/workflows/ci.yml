name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      KHORA_READ_TOKEN:
        required: true

jobs:
  backend:
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    runs-on: ubuntu-latest
    container: golang:1.27.1
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - name: Install guest protocol test runtime
        run: apt-get update -qq && apt-get install -y --no-install-recommends python3
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch pinned Go dependencies
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: ../scripts/fetch-go-dependencies.sh
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # A lockfile committed from a host with an npm mirror configured pins every
      # `resolved` URL to that mirror, and is then only installable from that one
      # network. Catch it here rather than as an ECONNRESET on someone's machine.
      - run: ../scripts/check-lockfile-registry.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s sandbox-image/tests -p 'test_*.py'
      - run: python3 scripts/check-public-docs.py
      - run: bash -n sandbox-image/build-rootfs.sh sandbox-image/build-khora-template.sh
