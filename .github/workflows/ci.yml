name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_browser:
        description: Include Firefox and WebKit scheduling and Office controls
        type: boolean
        default: false
  workflow_call:
    inputs:
      cross_browser:
        type: boolean
        default: false
    secrets:
      KHORA_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evolution-space:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: evolution-space/backend/go.mod
          cache-dependency-path: evolution-space/backend/go.sum
      - run: scripts/check.sh evolution-space
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
        working-directory: evolution-space/frontend
      - run: scripts/check.sh evolution-space-frontend

  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: volumes-studio/backend/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: scripts/check.sh studio
      - run: npm ci
        working-directory: volumes-studio/frontend
      - run: scripts/check.sh studio-frontend

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - run: scripts/check.sh source

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Fetch private engine dependency
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - name: Install pinned native Session test dependencies
        run: npm ci --ignore-scripts --prefix orchestrator/internal/runtimerelease
      - run: scripts/check.sh backend

  # Each browser runs the Studio suite on its own runner and fixture.
  studio-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: |
            orchestrator/go.sum
            volumes-studio/backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: volumes-studio/frontend/package-lock.json
      - run: npm ci --prefix volumes-studio/frontend
      - id: playwright
        run: echo "version=$(node -p "require('./volumes-studio/frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-${{ matrix.browser }}-
      - run: scripts/install-playwright.sh volumes-studio/frontend ${{ matrix.browser }}
        timeout-minutes: 25
        env:
          APT_ARCHIVE_CACHE: ~/.cache/apt-playwright
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm --prefix volumes-studio/frontend run build
      - run: scripts/check.sh studio-browser-suite ${{ matrix.browser }}
      - name: Failed Studio browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studio-browser-${{ matrix.browser }}-${{ github.run_attempt }}
          path: volumes-studio/frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Studio browser timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-browser-timings-${{ matrix.browser }}-${{ github.run_attempt }}
          path: volumes-studio/frontend/test-results/browser-report.json
          retention-days: 7
          if-no-files-found: ignore

  evolution-space-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: |
            orchestrator/go.sum
            evolution-space/backend/go.sum
            volumes-studio/backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: evolution-space/frontend/package-lock.json
      - run: npm ci --prefix evolution-space/frontend
      - id: playwright
        run: echo "version=$(node -p "require('./evolution-space/frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-${{ matrix.browser }}-
      - run: scripts/install-playwright.sh evolution-space/frontend ${{ matrix.browser }}
        timeout-minutes: 25
        env:
          APT_ARCHIVE_CACHE: ~/.cache/apt-playwright
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm --prefix evolution-space/frontend run build
      - run: scripts/check.sh evolution-space-browser ${{ matrix.browser }}
      - name: Failed Evolution Space browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: evolution-space-browser-${{ matrix.browser }}-${{ github.run_attempt }}
          path: evolution-space/frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Evolution Space browser timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evolution-space-browser-timings-${{ matrix.browser }}-${{ github.run_attempt }}
          path: evolution-space/frontend/test-results/browser-report.json
          retention-days: 7
          if-no-files-found: ignore

  # Real-process gates: Studio evaluation and the native evolution journeys.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [studio-integration, evolution-browser]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: |
            orchestrator/go.sum
            evolution-space/backend/go.sum
            volumes-studio/backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            volumes-studio/frontend/package-lock.json
            evolution-space/frontend/package-lock.json
            admin-frontend/package-lock.json
      - run: npm ci --prefix volumes-studio/frontend
      - name: Install Evolution Space and Administration frontends
        if: matrix.gate == 'evolution-browser'
        run: |
          npm ci --prefix evolution-space/frontend
          npm ci --prefix admin-frontend
      - id: playwright
        run: echo "version=$(node -p "require('./volumes-studio/frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-chromium-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-chromium-
      - run: scripts/install-playwright.sh volumes-studio/frontend chromium
        timeout-minutes: 25
        env:
          APT_ARCHIVE_CACHE: ~/.cache/apt-playwright
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-chromium-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build Studio
        if: matrix.gate == 'studio-integration'
        run: npm --prefix volumes-studio/frontend run build
      - run: scripts/check.sh ${{ matrix.gate }}
      - name: Failed integration browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gate }}-failure-${{ github.run_attempt }}
          path: |
            evolution-space/frontend/test-results/numbered-retry
            evolution-space/frontend/test-results/dynamic
            evolution-space/frontend/test-results/tools
            evolution-space/frontend/test-results/retention
            admin-frontend/test-results/evolution-live
            admin-frontend/test-results/studio-permissions
            volumes-studio/frontend/test-results/evaluator-replacement
            volumes-studio/frontend/test-results/evaluation-policy
            volumes-studio/frontend/test-results/path-policies
          retention-days: 7
          if-no-files-found: ignore

  # The race-instrumented product suite outgrew one 30-minute run; shards
  # split its tests round-robin (shard 0 also runs the smaller packages).
  race:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Fetch private engine dependency
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - name: Install pinned native Session test dependencies
        run: npm ci --ignore-scripts --prefix orchestrator/internal/runtimerelease
      - name: Core race checks (main and explicit qualification)
        run: scripts/check.sh race ${{ matrix.shard }}/4

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - name: Fetch private engine dependency for real edge qualification
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-frontend/package-lock.json
      - name: Restore frontend check cache
        uses: actions/cache@v6
        with:
          path: |
            frontend/.next/cache
            admin-frontend/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-frontend-${{ hashFiles('.node-version', 'frontend/package-lock.json', 'frontend/next.config.mjs', 'frontend/tsconfig.json', 'frontend/eslint.config.mjs', 'admin-frontend/package-lock.json', 'admin-frontend/next.config.mjs', 'admin-frontend/tsconfig.json', 'admin-frontend/eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-frontend-${{ hashFiles('.node-version', 'frontend/package-lock.json', 'frontend/next.config.mjs', 'frontend/tsconfig.json', 'frontend/eslint.config.mjs', 'admin-frontend/package-lock.json', 'admin-frontend/next.config.mjs', 'admin-frontend/tsconfig.json', 'admin-frontend/eslint.config.mjs') }}-
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: admin-frontend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - run: python -m pip install -r frontend/e2e/requirements.txt
      - id: playwright
        run: echo "version=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-chromium-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-chromium-
      - run: scripts/install-playwright.sh frontend chromium
        timeout-minutes: 25
        env:
          APT_ARCHIVE_CACHE: ~/.cache/apt-playwright
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-apt-playwright-chromium-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Frontend lint
        run: scripts/check.sh frontend-lint
      - name: Frontend unit tests
        run: scripts/check.sh frontend-unit
      - name: Frontend production build and types
        run: scripts/check.sh frontend-build
      - name: Frontend browser tests
        run: scripts/check.sh frontend-ui
      - name: Real Go edge and both standalone frontends
        run: scripts/check.sh frontend-edge
      - name: Install additional release browsers
        if: inputs.cross_browser
        run: scripts/install-playwright.sh frontend firefox webkit
        timeout-minutes: 15
        env:
          APT_ARCHIVE_CACHE: ~/.cache/apt-playwright
      - name: Cross-browser scheduling controls (reuse build)
        if: inputs.cross_browser
        run: npx --no-install playwright test --config playwright.pickers.config.ts
        working-directory: frontend
      - name: Cross-browser Office previews (reuse build)
        if: inputs.cross_browser
        run: npx --no-install playwright test --config playwright.office.config.ts
        working-directory: frontend
      - name: Failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results/ui
            admin-frontend/test-results/ui
            admin-frontend/test-results/live
            frontend/test-results/pickers
            frontend/test-results/office-browsers
          retention-days: 7
          if-no-files-found: ignore
      - name: Browser timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-timings-${{ github.run_attempt }}
          path: |
            frontend/test-results/ui-report.json
            admin-frontend/test-results/ui-report.json
            admin-frontend/test-results/live-report.json
            frontend/test-results/pickers-report.json
            frontend/test-results/office-report.json
          retention-days: 7
          if-no-files-found: ignore
