name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_browser:
        description: Include Firefox and WebKit scheduling controls
        type: boolean
        default: false
  workflow_call:
    inputs:
      cross_browser:
        type: boolean
        default: false
    secrets:
      KHORA_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - run: scripts/check.sh source

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Fetch private engine dependency
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - name: Install pinned native Session test dependencies
        run: npm ci --ignore-scripts --prefix orchestrator/internal/runtimerelease
      - run: scripts/check.sh backend
      - name: Core race checks (main and explicit qualification)
        if: github.event_name != 'pull_request'
        run: scripts/check.sh race

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - run: python -m pip install -r frontend/e2e/requirements.txt
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/check.sh frontend
      - name: Install additional release browsers
        if: inputs.cross_browser
        run: npx --no-install playwright install --with-deps firefox webkit
        working-directory: frontend
      - name: Cross-browser scheduling controls (reuse build)
        if: inputs.cross_browser
        run: npx --no-install playwright test --config playwright.pickers.config.ts
        working-directory: frontend
      - name: Failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results/ui
            frontend/test-results/pickers
          retention-days: 7
          if-no-files-found: ignore
