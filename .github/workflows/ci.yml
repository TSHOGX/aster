name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_browser:
        description: Include Firefox and WebKit scheduling and Office controls
        type: boolean
        default: false
  workflow_call:
    inputs:
      cross_browser:
        type: boolean
        default: false
    secrets:
      KHORA_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-space:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: evaluation-space/backend/go.mod
          cache-dependency-path: evaluation-space/backend/go.sum
      - run: scripts/check.sh evaluation-space
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
        working-directory: evaluation-space/frontend
      - run: scripts/check.sh evaluation-frontend

  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: volumes-studio/backend/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: scripts/check.sh studio
      - run: npm ci
        working-directory: volumes-studio/frontend
      - run: scripts/check.sh studio-frontend

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - run: scripts/check.sh source

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Fetch private engine dependency
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - name: Install pinned native Session test dependencies
        run: npm ci --ignore-scripts --prefix orchestrator/internal/runtimerelease
      - run: scripts/check.sh backend
      - name: Install Studio browser gate dependencies
        run: npm ci --prefix volumes-studio/frontend
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
        working-directory: volumes-studio/frontend
      - run: npm --prefix volumes-studio/frontend run build
      - run: scripts/check.sh studio-browser
      - run: npm ci --prefix evaluation-space/frontend
      - run: npm --prefix evaluation-space/frontend run build
      - run: scripts/check.sh evaluation-browser
      - name: Install admin evolution browser gate dependencies
        run: npm ci --prefix admin-frontend
      - name: Native evolution authoring and activation browser gates
        run: scripts/check.sh evolution-browser
      - name: Failed evolution browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: evolution-browser-failure-${{ github.run_attempt }}
          path: |
            admin-frontend/test-results/evolution-live
            volumes-studio/frontend/test-results/evaluation-policy
          retention-days: 7
          if-no-files-found: ignore
      - name: Core race checks (main and explicit qualification)
        if: github.event_name != 'pull_request'
        run: scripts/check.sh race

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - name: Fetch private engine dependency for real edge qualification
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-frontend/package-lock.json
      - name: Restore frontend check cache
        uses: actions/cache@v6
        with:
          path: |
            frontend/.next/cache
            admin-frontend/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-frontend-${{ hashFiles('.node-version', 'frontend/package-lock.json', 'frontend/next.config.mjs', 'frontend/tsconfig.json', 'frontend/eslint.config.mjs', 'admin-frontend/package-lock.json', 'admin-frontend/next.config.mjs', 'admin-frontend/tsconfig.json', 'admin-frontend/eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-frontend-${{ hashFiles('.node-version', 'frontend/package-lock.json', 'frontend/next.config.mjs', 'frontend/tsconfig.json', 'frontend/eslint.config.mjs', 'admin-frontend/package-lock.json', 'admin-frontend/next.config.mjs', 'admin-frontend/tsconfig.json', 'admin-frontend/eslint.config.mjs') }}-
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: admin-frontend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/e2e/requirements.txt
      - run: python -m pip install -r frontend/e2e/requirements.txt
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - name: Frontend lint
        run: scripts/check.sh frontend-lint
      - name: Frontend unit tests
        run: scripts/check.sh frontend-unit
      - name: Frontend production build and types
        run: scripts/check.sh frontend-build
      - name: Frontend browser tests
        run: scripts/check.sh frontend-ui
      - name: Real Go edge and both standalone frontends
        run: scripts/check.sh frontend-edge
      - name: Install additional release browsers
        if: inputs.cross_browser
        run: npx --no-install playwright install --with-deps firefox webkit
        working-directory: frontend
      - name: Cross-browser scheduling controls (reuse build)
        if: inputs.cross_browser
        run: npx --no-install playwright test --config playwright.pickers.config.ts
        working-directory: frontend
      - name: Cross-browser Office previews (reuse build)
        if: inputs.cross_browser
        run: npx --no-install playwright test --config playwright.office.config.ts
        working-directory: frontend
      - name: Failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-failure-${{ github.run_attempt }}
          path: |
            frontend/test-results/ui
            admin-frontend/test-results/ui
            admin-frontend/test-results/live
            frontend/test-results/pickers
            frontend/test-results/office-browsers
          retention-days: 7
          if-no-files-found: ignore
      - name: Browser timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-timings-${{ github.run_attempt }}
          path: |
            frontend/test-results/ui-report.json
            admin-frontend/test-results/ui-report.json
            admin-frontend/test-results/live-report.json
            frontend/test-results/pickers-report.json
            frontend/test-results/office-report.json
          retention-days: 7
          if-no-files-found: ignore
