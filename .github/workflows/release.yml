name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/release/check-source.py
  verify:
    needs: source
    uses: ./.github/workflows/ci.yml
  apps:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: orchestrator/go.sum
      - run: python3 scripts/release/build-apps.py --version "$GITHUB_REF_NAME" --output /tmp/harness-release
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: /tmp/harness-release/
          retention-days: 14
  sandbox:
    needs: verify
    runs-on: [self-hosted, linux, x64, harness-release]
    environment: release-build
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.oci.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - run: sudo scripts/release/build-rootfs.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/harness-rootfs-$GITHUB_RUN_ID"
      - id: oci
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}/sandbox"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd "$RUNNER_TEMP/harness-rootfs-$GITHUB_RUN_ID"
          # Never overwrite a previously pushed tag, including a failed candidate.
          if oras manifest fetch "$registry:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Sandbox tag exists; release a new candidate instead of overwriting" >&2
            exit 1
          fi
          oras push "$registry:$GITHUB_REF_NAME" \
            --artifact-type application/vnd.harness.sandbox.v1 \
            "sandbox-$GITHUB_REF_NAME-linux-amd64.tar.gz:application/vnd.harness.rootfs.v1.tar+gzip"
          digest=$(oras resolve "$registry:$GITHUB_REF_NAME")
          echo "reference=$registry@$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-build
          path: ${{ runner.temp }}/harness-rootfs-${{ github.run_id }}/
          retention-days: 14
      - if: always()
        run: oras logout ghcr.io
  assemble:
    needs: [apps, sandbox]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: /tmp/release
      - name: Assemble compatibility manifest
        env:
          SANDBOX_REFERENCE: ${{ needs.sandbox.outputs.reference }}
          QUALIFIED_RUNSC_VERSION: ${{ vars.HARNESS_RUNSC_VERSION }}
        run: |
          test -n "$QUALIFIED_RUNSC_VERSION"
          python3 scripts/release/manifest.py --directory /tmp/release --sandbox-reference "$SANDBOX_REFERENCE" --runsc-version "$QUALIFIED_RUNSC_VERSION"
          cp docs/delivery/operations.md /tmp/release/UPGRADE.md
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: /tmp/release/
          retention-days: 14
  qualify:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    runs-on: [self-hosted, linux, x64, harness-qualification, '${{ matrix.ubuntu }}']
    environment: release-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: ${{ runner.temp }}/qualification-${{ github.run_id }}
      - name: Native isolated host qualification
        env:
          QUALIFICATION_UBUNTU: ${{ matrix.ubuntu }}
        run: |
          umask 077
          test -x /etc/harness-release/qualify
          sudo /etc/harness-release/qualify \
            --candidate "$RUNNER_TEMP/qualification-$GITHUB_RUN_ID" \
            --ubuntu "$QUALIFICATION_UBUNTU" \
            --report "$RUNNER_TEMP/qualification-$GITHUB_RUN_ID/qualification-$QUALIFICATION_UBUNTU.json" \
            > "$RUNNER_TEMP/qualification-$GITHUB_RUN_ID/private-qualification.log" 2>&1
          sudo python3 scripts/release/sanitize-qualification.py \
            --manifest "$RUNNER_TEMP/qualification-$GITHUB_RUN_ID/release-manifest.json" \
            --report "$RUNNER_TEMP/qualification-$GITHUB_RUN_ID/qualification-$QUALIFICATION_UBUNTU.json" \
            --ubuntu "$QUALIFICATION_UBUNTU" \
            > "$RUNNER_TEMP/public-qualification-$QUALIFICATION_UBUNTU.json"
          mkdir -p "$RUNNER_TEMP/public-qualification"
          mv "$RUNNER_TEMP/public-qualification-$QUALIFICATION_UBUNTU.json" "$RUNNER_TEMP/public-qualification/qualification-$QUALIFICATION_UBUNTU.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/public-qualification/qualification-${{ matrix.ubuntu }}.json
  publish:
    needs: [assemble, qualify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    environment: release-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate
          path: /tmp/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-*
          path: /tmp/release
          merge-multiple: true
      - run: python3 scripts/release/verify-qualification.py --directory /tmp/release
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Verify registry content before publishing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          reference=$(python3 -c 'import json; print(json.load(open("/tmp/release/release-manifest.json"))["sandbox"]["reference"])')
          mkdir /tmp/verify-rootfs
          oras pull "$reference" --output /tmp/verify-rootfs
          cd /tmp/release
          sha256sum --check SHA256SUMS
          cmp "sandbox-$GITHUB_REF_NAME-linux-amd64.tar.gz" "/tmp/verify-rootfs/sandbox-$GITHUB_REF_NAME-linux-amd64.tar.gz"
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/publish.py --directory /tmp/release --repository "$GITHUB_REPOSITORY"
      - if: always()
        run: oras logout ghcr.io
