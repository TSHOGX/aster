name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/release/check-source.py
  verify:
    needs: source
    uses: ./.github/workflows/ci.yml
    secrets:
      KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
  apps:
    env:
      GOPRIVATE: github.com/TSHOGX/khora
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Fetch pinned Go dependencies
        env:
          KHORA_READ_TOKEN: ${{ secrets.KHORA_READ_TOKEN }}
        run: scripts/fetch-go-dependencies.sh
      - run: python3 scripts/release/build-apps.py --version "$GITHUB_REF_NAME" --output /tmp/harness-release
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: /tmp/harness-release/
          retention-days: 14
  sandbox:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.oci.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debootstrap rsync xz-utils
          df -h /tmp
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - run: sudo scripts/release/build-rootfs.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/harness-rootfs"
      - id: oci
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}/sandbox"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd "$RUNNER_TEMP/harness-rootfs"
          if oras manifest fetch "$registry:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Sandbox tag exists; use a new candidate instead of overwriting" >&2
            exit 1
          fi
          oras push "$registry:$GITHUB_REF_NAME" \
            --artifact-type application/vnd.harness.sandbox.v1 \
            "sandbox-$GITHUB_REF_NAME-linux-amd64.tar.gz:application/vnd.harness.rootfs.v1.tar+gzip"
          digest=$(oras resolve "$registry:$GITHUB_REF_NAME")
          echo "reference=$registry@$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-build
          path: |
            ${{ runner.temp }}/harness-rootfs/rootfs-apt-packages.txt
            ${{ runner.temp }}/harness-rootfs/rootfs-python-packages.txt
            ${{ runner.temp }}/harness-rootfs/rootfs-requirements.lock
          retention-days: 14
      - if: always()
        run: oras logout ghcr.io
  assemble:
    needs: [apps, sandbox]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: /tmp/release
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Assemble complete release manifest
        env:
          SANDBOX_REFERENCE: ${{ needs.sandbox.outputs.reference }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras pull "$SANDBOX_REFERENCE" --output /tmp/release
          oras logout ghcr.io
          python3 scripts/release/manifest.py --directory /tmp/release --sandbox-reference "$SANDBOX_REFERENCE"
          cp docs/delivery/operations.md /tmp/release/UPGRADE.md
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            /tmp/release/*
            !/tmp/release/sandbox-*.tar.gz
          retention-days: 14
  smoke:
    needs: assemble
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Fetch rootfs by digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/pull-rootfs.py --directory "$RUNNER_TEMP/candidate"
      - name: Install pinned sandbox runtime on temporary runner
        run: python3 scripts/release/install-runsc.py --output "$RUNNER_TEMP/runsc"
      - name: Test packaged applications, migrations and sandbox
        env:
          TEST_UBUNTU: ${{ matrix.ubuntu }}
        run: |
          sudo python3 scripts/release/smoke-artifacts.py \
            --directory "$RUNNER_TEMP/candidate" \
            --ubuntu "$TEST_UBUNTU" \
            --runsc "$RUNNER_TEMP/runsc" \
            --report "$RUNNER_TEMP/artifact-smoke-$TEST_UBUNTU.json"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-smoke-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/artifact-smoke-${{ matrix.ubuntu }}.json
  publish:
    needs: [assemble, smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate
          path: /tmp/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-smoke-*
          path: /tmp/release
          merge-multiple: true
      - run: python3 scripts/release/verify-artifact-reports.py --directory /tmp/release
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - name: Fetch and verify all release content
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release/pull-rootfs.py --directory /tmp/release
          cd /tmp/release
          sha256sum --check SHA256SUMS
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/publish.py --directory /tmp/release --repository "$GITHUB_REPOSITORY"
      - if: always()
        run: oras logout ghcr.io
