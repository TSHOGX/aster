<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Harness sandbox font policy: ensure every generic family has CJK
       coverage so Chinese text never renders as tofu boxes, including in
       monospace/code/table contexts where the default DejaVu Sans Mono has
       no CJK glyphs.

       Latin defaults stay primary (correct metrics for ASCII / code); CJK
       fonts are appended as weak fallbacks so only glyphs the Latin font
       lacks fall through to them. Preference order for CJK:
         1. Noto CJK  - broadest coverage; has a real CJK serif and a mono face
         2. WenQuanYi - always present in the base image; mono variant for code
  -->

  <!-- monospace: DejaVu Sans Mono (Latin) -> Noto/WenQuanYi Mono (CJK) -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
      <string>WenQuanYi Zen Hei Mono</string>
      <string>WenQuanYi Micro Hei Mono</string>
    </edit>
  </match>

  <!-- sans-serif: DejaVu Sans (Latin) -> Noto Sans / WenQuanYi (CJK) -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>

  <!-- serif: DejaVu Serif (Latin) -> Noto Serif CJK (real CJK serif) -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
</fontconfig>
